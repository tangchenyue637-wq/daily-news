name: 每日新闻推送

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  push-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python news_bot.py
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
